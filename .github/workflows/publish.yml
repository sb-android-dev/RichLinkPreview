name: Publish to Maven Central

# Runs when a version tag such as v1.0.0 is pushed. The tag must match VERSION_NAME in
# gradle.properties. Required repository secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  - Central Portal user token
#   SIGNING_KEY, SIGNING_KEY_PASSWORD               - ASCII-armored GPG private key and its passphrase
# See PUBLISHING.md for how to create them.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches VERSION_NAME
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${version} in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :richlinkpreview:testDebugUnitTest

      - name: Publish and release to Maven Central
        run: ./gradlew :richlinkpreview:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
